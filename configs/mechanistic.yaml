    - dense-s45
    - oneshot50-robust-s42
    - oneshot50-transition-s42
    - rewind80-init-s42
    - rewind80-robust-s42
    - imp-r03-s42
    - imp-r09-s42
    - imp-r13-s42

evaluation:
  seeds: [46]
  model_ids:
    - dense-s46
    - oneshot50-robust-s46
    - oneshot50-transition-s46
    - oneshot80-robust-s46
    - oneshot80-transition-s46
    - rewind80-init-s46
